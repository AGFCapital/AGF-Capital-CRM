<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGF — Protótipo CRM</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <div class="prototype-switcher" aria-label="Alternar proposta visual">
      <button id="previous-variant" class="switcher-arrow" aria-label="Proposta anterior">←</button>
      <span id="variant-name"></span>
      <button id="next-variant" class="switcher-arrow" aria-label="Próxima proposta">→</button>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
